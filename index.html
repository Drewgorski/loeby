<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Loeby" />

         where a bare relative path would 404. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- It's a personal rehab program with her history in it: reachable by URL,
         but not something search engines should be indexing. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>The Loeby Program</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
